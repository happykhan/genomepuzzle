[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomepuzzle"
version = "0.1.0"
description = "Dataset generator for microbial genomics training exercises."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Nabil-Fareed Alikhan" }
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
genomepuzzle = "genomepuzzle.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["genomepuzzle*"]
