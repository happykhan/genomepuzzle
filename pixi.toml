[project]
name = "genomepuzzle"
version = "0.1.0"
description = "Dataset generator for microbial genomics training exercises"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.10,<3.13"
typer = ">=0.12"
rich = ">=13.7"
pytest = ">=8.0"
pytest-mock = ">=3.14"
art = "*"
seqtk = "*"
sra-tools = "*"
ncbi-datasets-cli = "*"
pigz = "*"
unzip = "*"
kleborate = "==3.1.3"
badread = "*"
flye = "*"
spades = "*"
tomli = ">=2.0"

[tasks]
genomepuzzle = "python -m genomepuzzle.main"
test = "pytest"
lint = "python -m py_compile genomepuzzle/*.py genomepuzzle/sample/*.py"
