[workspace]
name = "genomepuzzle"
version = "0.1.0"
description = "Dataset generator for microbial genomics training exercises"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"
typer = "==0.26.5"
rich = "==15.0.0"
pytest = "==9.0.3"
pytest-mock = "==3.15.1"
art = "==2016.06.05"
seqtk = "==1.5"
sra-tools = "==3.4.1"
ncbi-datasets-cli = "==18.29.1"
pigz = "==2.8"
unzip = "==6.0"
kleborate = "==3.1.3"
badread = "==0.4.2"
flye = "==2.9.6"
spades = "==4.2.0"
minimap2 = "==2.31"
mashtree = "==1.4.6"
iqtree = "==3.1.2"
tomli = "==2.4.1"
mkdocs-material = "==9.7.7"

[tasks]
genomepuzzle = "python -m genomepuzzle.main"
test = "pytest"
lint = "python -m py_compile genomepuzzle/*.py genomepuzzle/sample/*.py"
docs-build = "mkdocs build --strict"
docs-serve = "mkdocs serve"
