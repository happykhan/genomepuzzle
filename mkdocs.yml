site_name: GenomePuzzle
site_description: Reproducible microbial genomics assessment dataset generation
site_url: https://happykhan.github.io/genomepuzzle/
repo_url: https://github.com/happykhan/genomepuzzle
repo_name: happykhan/genomepuzzle
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - First release: getting-started/first-release.md
  - Author datasets:
      - Release specifications: authoring/release-specification.md
      - Genotyping: authoring/typing.md
      - Short-read assembly: authoring/assembly.md
      - Hybrid assembly: authoring/hybrid.md
      - Phylogeny and outbreak: authoring/outbreak.md
      - Participant CSV fields: csv_schemas.md
  - Operate releases:
      - SLURM workflow: operations/slurm.md
      - Release-building reference: release-building.md
      - Validate and publish: operations/validation.md
      - Troubleshooting: operations/troubleshooting.md
  - Integrate:
      - Release contract v2: release-contract-v2.md
  - Project:
      - Design and roadmap: assessment-platform-plan.md
      - Contributing: contributing.md

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
