name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Install environment
        run: pixi install

      - name: Compile Python modules
        run: pixi run lint

      - name: Run test suite
        run: pixi run test
